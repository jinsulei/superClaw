[package]
name = "superclaw"
version = "1.0.1"
edition = "2021"
description = "SuperClaw AI 管理面板"
authors = []
repository = ""
homepage = ""
license = "Proprietary"

[lib]
name = "superclaw_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Production builds MUST enable this. `npm run tauri:build` (tauri build) injects
# tauri/custom-protocol automatically, which makes the binary load the embedded
# frontend via the tauri:// (tauri.localhost) protocol instead of the Vite dev server.
#
# WARNING: never produce a release EXE with a bare `cargo build --release`.
# Without custom-protocol the tauri build.rs sets `dev = true`, so the packaged app
# boots WebView2 pointed at the (unavailable) dev URL http://localhost:1420 and
# shows "localhost refused connection". Use `npm run tauri:build` instead.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream", "gzip", "brotli", "deflate"], default-features = false }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
urlencoding = "2"
regex = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros"] }

flate2 = "1"
tar = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
